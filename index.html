<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGPA Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      box-sizing: border-box;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .animate-slide-in {
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .tooltip {
      position: relative;
    }

    .tooltip:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem 0.75rem;
      background: #1f2937;
      color: white;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      white-space: nowrap;
      z-index: 50;
      margin-bottom: 0.5rem;
    }

    .grade-select:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .export-modal {
      backdrop-filter: blur(4px);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="h-full w-full"></div>
  <script>
    // Grade policy configuration
    const GRADE_POLICY = {
      'A+': 4.00,
      'A': 3.75,
      'A-': 3.50,
      'B+': 3.25,
      'B': 3.00,
      'B-': 2.75,
      'C+': 2.50,
      'C': 2.25,
      'D': 2.00,
      'F': 0.00
    };

    const GRADE_OPTIONS = Object.keys(GRADE_POLICY);

    // Default configuration
    const defaultConfig = {
      app_title: "CGPA Calculator",
      app_subtitle: "Track your academic progress semester by semester",
      add_course_button: "Add Course",
      add_semester_button: "Add Semester",
      export_button: "Export",
      primary_color: "#3b82f6",
      secondary_color: "#f3f4f6",
      text_color: "#111827",
      surface_color: "#ffffff",
      accent_color: "#10b981",
      font_family: "Inter",
      font_size: 16
    };

    let config = { ...defaultConfig };

    // State management
    let state = {
      semesters: [
        {
          id: 1,
          name: "Semester 1",
          courses: []
        }
      ],
      nextSemesterId: 2,
      nextCourseId: 1,
      showExportModal: false,
      errors: {}
    };

    // Load from localStorage
    function loadFromStorage() {
      try {
        const saved = localStorage.getItem('cgpa-calculator-data');
        if (saved) {
          const parsed = JSON.parse(saved);
          state.semesters = parsed.semesters || state.semesters;
          state.nextSemesterId = parsed.nextSemesterId || state.nextSemesterId;
          state.nextCourseId = parsed.nextCourseId || state.nextCourseId;
        }
      } catch (e) {
        console.error('Failed to load from storage:', e);
      }
    }

    // Save to localStorage
    function saveToStorage() {
      try {
        localStorage.setItem('cgpa-calculator-data', JSON.stringify({
          semesters: state.semesters,
          nextSemesterId: state.nextSemesterId,
          nextCourseId: state.nextCourseId
        }));
      } catch (e) {
        console.error('Failed to save to storage:', e);
      }
    }

    // Calculation functions
    function calculateSemesterGPA(courses) {
      const validCourses = courses.filter(c => c.credits > 0 && c.grade);
      if (validCourses.length === 0) return null;

      const totalPoints = validCourses.reduce((sum, course) => {
        return sum + (GRADE_POLICY[course.grade] * course.credits);
      }, 0);

      const totalCredits = validCourses.reduce((sum, course) => sum + course.credits, 0);

      return totalCredits > 0 ? totalPoints / totalCredits : null;
    }

    function calculateCGPA() {
      let totalPoints = 0;
      let totalCredits = 0;

      state.semesters.forEach(semester => {
        semester.courses.forEach(course => {
          if (course.credits > 0 && course.grade) {
            totalPoints += GRADE_POLICY[course.grade] * course.credits;
            totalCredits += course.credits;
          }
        });
      });

      return totalCredits > 0 ? totalPoints / totalCredits : null;
    }

    // Course management
    function addCourse(semesterId) {
      const semester = state.semesters.find(s => s.id === semesterId);
      if (semester) {
        semester.courses.push({
          id: state.nextCourseId++,
          name: '',
          credits: '',
          grade: ''
        });
        saveToStorage();
        render();
      }
    }

    function updateCourse(semesterId, courseId, field, value) {
      const semester = state.semesters.find(s => s.id === semesterId);
      if (semester) {
        const course = semester.courses.find(c => c.id === courseId);
        if (course) {
          if (field === 'credits') {
            const numValue = parseFloat(value);
            if (value === '' || (!isNaN(numValue) && numValue > 0)) {
              course[field] = value === '' ? '' : numValue;
              delete state.errors[`${semesterId}-${courseId}-credits`];
            } else {
              state.errors[`${semesterId}-${courseId}-credits`] = 'Please enter a valid credits value (> 0).';
            }
          } else {
            course[field] = value;
          }
          saveToStorage();
          render();
        }
      }
    }

    function deleteCourse(semesterId, courseId) {
      const semester = state.semesters.find(s => s.id === semesterId);
      if (semester) {
        semester.courses = semester.courses.filter(c => c.id !== courseId);
        delete state.errors[`${semesterId}-${courseId}-credits`];
        saveToStorage();
        render();
      }
    }

    // Semester management
    function addSemester() {
      state.semesters.push({
        id: state.nextSemesterId++,
        name: `Semester ${state.semesters.length + 1}`,
        courses: []
      });
      saveToStorage();
      render();
    }

    function deleteSemester(semesterId) {
      if (state.semesters.length > 1) {
        state.semesters = state.semesters.filter(s => s.id !== semesterId);
        saveToStorage();
        render();
      }
    }

    // Export functionality
    function exportToCSV() {
      const rows = [
        ['Semester', 'Course', 'Credits', 'Grade', 'GradeValue', 'SemesterGPA', 'CumulativeCGPA']
      ];

      let cumulativePoints = 0;
      let cumulativeCredits = 0;

      state.semesters.forEach(semester => {
        const semesterGPA = calculateSemesterGPA(semester.courses);
        
        semester.courses.forEach(course => {
          if (course.credits > 0 && course.grade) {
            cumulativePoints += GRADE_POLICY[course.grade] * course.credits;
            cumulativeCredits += course.credits;
            const cgpa = cumulativeCredits > 0 ? (cumulativePoints / cumulativeCredits).toFixed(2) : '';

            rows.push([
              semester.name,
              course.name || 'Unnamed Course',
              course.credits,
              course.grade,
              GRADE_POLICY[course.grade],
              semesterGPA ? semesterGPA.toFixed(2) : '',
              cgpa
            ]);
          }
        });
      });

      const csv = rows.map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'cgpa-transcript.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportToPDF() {
      const printWindow = window.open('', '_blank');
      const cgpa = calculateCGPA();
      
      let html = `
        <!DOCTYPE html>
        <html>
        <head>
          <title>CGPA Transcript</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 40px; }
            h1 { color: #1f2937; margin-bottom: 10px; }
            .subtitle { color: #6b7280; margin-bottom: 30px; }
            .cgpa-box { background: #eff6ff; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
            .cgpa-label { color: #1e40af; font-weight: 600; }
            .cgpa-value { font-size: 36px; font-weight: 700; color: #1e40af; }
            .semester { margin-bottom: 30px; page-break-inside: avoid; }
            .semester-title { background: #f3f4f6; padding: 10px; font-weight: 600; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            th, td { padding: 8px; text-align: left; border-bottom: 1px solid #e5e7eb; }
            th { background: #f9fafb; font-weight: 600; color: #374151; }
            .footer { margin-top: 40px; padding-top: 20px; border-top: 2px solid #e5e7eb; color: #6b7280; font-size: 12px; }
          </style>
        </head>
        <body>
          <h1>${config.app_title || defaultConfig.app_title}</h1>
          <div class="subtitle">${config.app_subtitle || defaultConfig.app_subtitle}</div>
          <div class="cgpa-box">
            <div class="cgpa-label">Cumulative CGPA</div>
            <div class="cgpa-value">${cgpa ? cgpa.toFixed(2) : 'N/A'}</div>
          </div>
      `;

      state.semesters.forEach(semester => {
        const semesterGPA = calculateSemesterGPA(semester.courses);
        html += `
          <div class="semester">
            <div class="semester-title">${semester.name} ${semesterGPA ? `- GPA: ${semesterGPA.toFixed(2)}` : ''}</div>
            <table>
              <thead>
                <tr>
                  <th>Course</th>
                  <th>Credits</th>
                  <th>Grade</th>
                  <th>Grade Value</th>
                </tr>
              </thead>
              <tbody>
        `;

        semester.courses.forEach(course => {
          if (course.credits > 0 && course.grade) {
            html += `
              <tr>
                <td>${course.name || 'Unnamed Course'}</td>
                <td>${course.credits}</td>
                <td>${course.grade}</td>
                <td>${GRADE_POLICY[course.grade].toFixed(2)}</td>
              </tr>
            `;
          }
        });

        html += `
              </tbody>
            </table>
          </div>
        `;
      });

      html += `
          <div class="footer">
            Generated on ${new Date().toLocaleDateString()} at ${new Date().toLocaleTimeString()}
          </div>
        </body>
        </html>
      `;

      printWindow.document.write(html);
      printWindow.document.close();
      setTimeout(() => {
        printWindow.print();
      }, 250);
    }

    function importFromCSV() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.csv';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const text = await file.text();
        const rows = text.split('\n').slice(1); // Skip header
        
        const newSemesters = new Map();

        rows.forEach(row => {
          const cols = row.split(',').map(col => col.replace(/^"|"$/g, '').trim());
          if (cols.length >= 5 && cols[0]) {
            const [semesterName, courseName, credits, grade] = cols;
            
            if (!newSemesters.has(semesterName)) {
              newSemesters.set(semesterName, {
                id: state.nextSemesterId++,
                name: semesterName,
                courses: []
              });
            }

            const creditsNum = parseFloat(credits);
            if (!isNaN(creditsNum) && creditsNum > 0 && GRADE_POLICY[grade] !== undefined) {
              newSemesters.get(semesterName).courses.push({
                id: state.nextCourseId++,
                name: courseName,
                credits: creditsNum,
                grade: grade
              });
            }
          }
        });

        if (newSemesters.size > 0) {
          state.semesters = Array.from(newSemesters.values());
          saveToStorage();
          render();
          state.showExportModal = false;
        }
      };
      input.click();
    }

    // Render functions
    function createCourseRow(semester, course) {
      const errorKey = `${semester.id}-${course.id}-credits`;
      const hasError = state.errors[errorKey];

      return `
        <div class="animate-slide-in bg-white rounded-lg p-4 shadow-sm border border-gray-200 hover:shadow-md transition-shadow">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-start">
            <div class="md:col-span-5">
              <label class="block text-sm font-medium text-gray-700 mb-1">Course Name</label>
              <input
                type="text"
                value="${course.name}"
                placeholder="e.g., Calculus I (optional)"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                onchange="updateCourse(${semester.id}, ${course.id}, 'name', this.value)"
              />
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">Credits</label>
              <input
                type="number"
                step="0.5"
                min="0.5"
                value="${course.credits}"
                placeholder="e.g., 3"
                class="w-full px-3 py-2 border ${hasError ? 'border-red-500' : 'border-gray-300'} rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                onchange="updateCourse(${semester.id}, ${course.id}, 'credits', this.value)"
                aria-invalid="${hasError ? 'true' : 'false'}"
              />
              ${hasError ? `<p class="text-red-500 text-xs mt-1">${state.errors[errorKey]}</p>` : ''}
            </div>
            <div class="md:col-span-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">Grade</label>
              <select
                class="grade-select w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                onchange="updateCourse(${semester.id}, ${course.id}, 'grade', this.value)"
                aria-label="Grade (select)"
              >
                <option value="">Select grade</option>
                ${GRADE_OPTIONS.map(grade => `
                  <option value="${grade}" ${course.grade === grade ? 'selected' : ''}>
                    ${grade} (${GRADE_POLICY[grade].toFixed(2)})
                  </option>
                `).join('')}
              </select>
            </div>
            <div class="md:col-span-2 flex items-end">
              <button
                onclick="deleteCourse(${semester.id}, ${course.id})"
                class="w-full md:w-auto px-4 py-2 text-red-600 hover:bg-red-50 rounded-md transition-colors font-medium"
                aria-label="Delete course"
              >
                Delete
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function createSemesterPanel(semester, index) {
      const semesterGPA = calculateSemesterGPA(semester.courses);
      const hasValidCourses = semester.courses.some(c => c.credits > 0 && c.grade);

      return `
        <div class="bg-gray-50 rounded-xl p-6 shadow-sm border border-gray-200 animate-slide-in">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
              <h2 class="text-xl font-semibold" style="color: ${config.text_color || defaultConfig.text_color}; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif; font-size: ${(config.font_size || defaultConfig.font_size) * 1.25}px;">
                ${semester.name}
              </h2>
              ${semesterGPA ? `
                <span class="tooltip px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-semibold" data-tooltip="Exact: ${semesterGPA}">
                  GPA: ${semesterGPA.toFixed(2)}
                </span>
              ` : ''}
            </div>
            ${state.semesters.length > 1 ? `
              <button
                onclick="deleteSemester(${semester.id})"
                class="px-3 py-1 text-red-600 hover:bg-red-50 rounded-md transition-colors text-sm font-medium"
                aria-label="Delete semester"
              >
                Delete Semester
              </button>
            ` : ''}
          </div>

          <div class="space-y-3 mb-4">
            ${semester.courses.length > 0 ? 
              semester.courses.map(course => createCourseRow(semester, course)).join('') :
              `<div class="text-center py-8 text-gray-500">
                <p style="font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif; font-size: ${(config.font_size || defaultConfig.font_size) * 0.875}px;">No courses yet — click '${config.add_course_button || defaultConfig.add_course_button}' to start.</p>
              </div>`
            }
          </div>

          <button
            onclick="addCourse(${semester.id})"
            class="w-full py-2 rounded-md font-medium transition-all hover:shadow-md"
            style="background-color: ${config.primary_color || defaultConfig.primary_color}; color: white; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif; font-size: ${(config.font_size || defaultConfig.font_size)}px;"
            onmouseover="this.style.opacity='0.9'"
            onmouseout="this.style.opacity='1'"
          >
            ${config.add_course_button || defaultConfig.add_course_button}
          </button>
        </div>
      `;
    }

    function createResultsCard() {
      const cgpa = calculateCGPA();
      const totalCourses = state.semesters.reduce((sum, s) => sum + s.courses.filter(c => c.credits > 0 && c.grade).length, 0);
      const totalCredits = state.semesters.reduce((sum, s) => {
        return sum + s.courses.reduce((cSum, c) => c.credits > 0 && c.grade ? cSum + c.credits : cSum, 0);
      }, 0);

      return `
        <div class="rounded-xl p-8 shadow-lg border border-gray-200 animate-fade-in" style="background-color: ${config.surface_color || defaultConfig.surface_color};">
          <div class="text-center">
            <h3 class="text-lg font-semibold mb-2" style="color: ${config.text_color || defaultConfig.text_color}; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif; font-size: ${(config.font_size || defaultConfig.font_size) * 1.125}px;">
              Cumulative CGPA
            </h3>
            ${cgpa ? `
              <div class="tooltip" data-tooltip="Exact: ${cgpa}">
                <div class="text-6xl font-bold mb-4" style="color: ${config.primary_color || defaultConfig.primary_color}; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif;">
                  ${cgpa.toFixed(2)}
                </div>
              </div>
            ` : `
              <div class="text-4xl font-bold mb-4" style="color: ${config.text_color || defaultConfig.text_color}; opacity: 0.3; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif;">
                N/A
              </div>
            `}
            <div class="grid grid-cols-2 gap-4 mt-6">
              <div class="text-center p-4 rounded-lg" style="background-color: ${config.secondary_color || defaultConfig.secondary_color};">
                <div class="text-2xl font-bold" style="color: ${config.text_color || defaultConfig.text_color}; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif;">
                  ${totalCourses}
                </div>
                <div class="text-sm" style="color: ${config.text_color || defaultConfig.text_color}; opacity: 0.7; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif; font-size: ${(config.font_size || defaultConfig.font_size) * 0.875}px;">
                  Courses
                </div>
              </div>
              <div class="text-center p-4 rounded-lg" style="background-color: ${config.secondary_color || defaultConfig.secondary_color};">
                <div class="text-2xl font-bold" style="color: ${config.text_color || defaultConfig.text_color}; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif;">
                  ${totalCredits.toFixed(1)}
                </div>
                <div class="text-sm" style="color: ${config.text_color || defaultConfig.text_color}; opacity: 0.7; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif; font-size: ${(config.font_size || defaultConfig.font_size) * 0.875}px;">
                  Credits
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function createExportModal() {
      if (!state.showExportModal) return '';

      return `
        <div class="export-modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 animate-fade-in" onclick="if(event.target === this) { state.showExportModal = false; render(); }">
          <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-2xl" onclick="event.stopPropagation()">
            <h3 class="text-xl font-bold mb-4" style="color: ${config.text_color || defaultConfig.text_color}; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif; font-size: ${(config.font_size || defaultConfig.font_size) * 1.25}px;">
              Export Options
            </h3>
            <div class="space-y-3">
              <button
                onclick="exportToCSV(); state.showExportModal = false; render();"
                class="w-full py-3 px-4 rounded-lg font-medium transition-all hover:shadow-md text-left flex items-center gap-3"
                style="background-color: ${config.primary_color || defaultConfig.primary_color}; color: white; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif; font-size: ${(config.font_size || defaultConfig.font_size)}px;"
                onmouseover="this.style.opacity='0.9'"
                onmouseout="this.style.opacity='1'"
              >
                <span>📄</span>
                <div>
                  <div>Export as CSV</div>
                  <div class="text-sm opacity-80">Download spreadsheet file</div>
                </div>
              </button>
              <button
                onclick="exportToPDF(); state.showExportModal = false; render();"
                class="w-full py-3 px-4 rounded-lg font-medium transition-all hover:shadow-md text-left flex items-center gap-3"
                style="background-color: ${config.accent_color || defaultConfig.accent_color}; color: white; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif; font-size: ${(config.font_size || defaultConfig.font_size)}px;"
                onmouseover="this.style.opacity='0.9'"
                onmouseout="this.style.opacity='1'"
              >
                <span>📑</span>
                <div>
                  <div>Export as PDF</div>
                  <div class="text-sm opacity-80">Print or save as PDF</div>
                </div>
              </button>
              <button
                onclick="importFromCSV()"
                class="w-full py-3 px-4 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-all text-left flex items-center gap-3"
                style="color: ${config.text_color || defaultConfig.text_color}; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif; font-size: ${(config.font_size || defaultConfig.font_size)}px;"
              >
                <span>📥</span>
                <div>
                  <div>Import from CSV</div>
                  <div class="text-sm opacity-70">Load existing transcript</div>
                </div>
              </button>
            </div>
            <button
              onclick="state.showExportModal = false; render();"
              class="w-full mt-4 py-2 px-4 bg-gray-200 hover:bg-gray-300 rounded-lg font-medium transition-colors"
              style="color: ${config.text_color || defaultConfig.text_color}; font-family: ${config.font_family || defaultConfig.font_family}, -apple-system, sans-serif; font-size: ${(config.font_size || defaultConfig.font_size)}px;"
            >
              Cancel
            </button>
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = `
