<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGPA Calculator</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .card-shadow {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }
    
    .input-focus:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .result-pulse {
      animation: pulse 0.5s ease-in-out;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .semester-item {
      transition: all 0.3s ease;
    }
    
    .semester-item:hover {
      transform: translateX(4px);
    }
    
    .delete-btn {
      transition: all 0.2s ease;
    }
    
    .delete-btn:hover {
      transform: scale(1.1);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full w-full overflow-auto">
  <div class="min-h-full w-full gradient-bg p-4 sm:p-6 md:p-8">
   <div class="max-w-4xl mx-auto"><!-- Header -->
    <div class="text-center mb-8 sm:mb-12">
     <h1 id="main-title" class="text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-3">CGPA Calculator</h1>
     <p id="subtitle" class="text-base sm:text-lg text-white/90">Calculate your Cumulative Grade Point Average</p>
    </div><!-- Main Card -->
    <div class="bg-white rounded-2xl card-shadow p-6 sm:p-8 mb-6"><!-- Add Semester Button --> <button id="add-semester-btn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-semibold py-3 px-6 rounded-xl mb-6 transition-all duration-200 transform hover:scale-105"> <span id="add-button-text">+ Add Semester</span> </button> <!-- Semesters List -->
     <div id="semesters-container" class="space-y-4 mb-6"><!-- Semesters will be added here -->
     </div><!-- Action Buttons -->
     <div class="flex flex-col sm:flex-row gap-3 mt-6"><button id="calculate-btn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 transform hover:scale-105"> <span id="calculate-button-text">Calculate CGPA</span> </button> <button id="reset-btn" class="flex-1 sm:flex-none bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 px-6 rounded-xl transition-all duration-200"> <span id="reset-button-text">Reset</span> </button> <button id="clear-all-btn" class="flex-1 sm:flex-none bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200"> Clear All </button>
     </div><!-- Result Display -->
     <div id="result-container" class="mt-6 p-6 bg-gradient-to-r from-purple-50 to-indigo-50 rounded-xl hidden">
      <div class="text-center">
       <p class="text-gray-600 text-sm sm:text-base font-medium mb-2">Your CGPA</p>
       <p id="cgpa-value" class="text-4xl sm:text-5xl font-bold text-purple-600"></p>
       <p id="total-credits" class="text-gray-500 text-sm sm:text-base mt-2"></p>
      </div>
     </div>
    </div><!-- Designer Credit -->
    <div class="text-center mt-6">
     <p class="text-white/70 text-sm">Designed by Soumitra</p>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      main_title: "CGPA Calculator",
      subtitle: "Calculate your Cumulative Grade Point Average",
      add_button_text: "+ Add Semester",
      calculate_button_text: "Calculate CGPA",
      reset_button_text: "Reset",
      primary_color: "#1e3a8a",
      secondary_color: "#ffffff",
      text_color: "#1f2937",
      accent_color: "#10b981",
      button_color: "#e5e7eb",
      font_family: "Inter",
      font_size: 16
    };

    let semesterCount = 0;

    async function onConfigChange(config) {
      const baseSize = config.font_size || defaultConfig.font_size;
      const customFont = config.font_family || defaultConfig.font_family;
      const baseFontStack = '-apple-system, BlinkMacSystemFont, sans-serif';
      
      // Update text content
      document.getElementById('main-title').textContent = config.main_title || defaultConfig.main_title;
      document.getElementById('subtitle').textContent = config.subtitle || defaultConfig.subtitle;
      document.getElementById('add-button-text').textContent = config.add_button_text || defaultConfig.add_button_text;
      document.getElementById('calculate-button-text').textContent = config.calculate_button_text || defaultConfig.calculate_button_text;
      document.getElementById('reset-button-text').textContent = config.reset_button_text || defaultConfig.reset_button_text;
      
      // Update colors
      const primaryColor = config.primary_color || defaultConfig.primary_color;
      const secondaryColor = config.secondary_color || defaultConfig.secondary_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const accentColor = config.accent_color || defaultConfig.accent_color;
      const buttonColor = config.button_color || defaultConfig.button_color;
      
      document.querySelector('.gradient-bg').style.background = `linear-gradient(135deg, ${primaryColor} 0%, ${adjustColor(primaryColor, -30)} 100%)`;
      
      document.querySelectorAll('.bg-white').forEach(el => {
        if (!el.classList.contains('bg-white/95')) {
          el.style.backgroundColor = secondaryColor;
        }
      });
      
      document.getElementById('main-title').style.color = '#ffffff';
      document.getElementById('subtitle').style.color = 'rgba(255, 255, 255, 0.9)';
      
      document.querySelectorAll('.text-gray-700, .text-gray-800, .text-gray-600').forEach(el => {
        el.style.color = textColor;
      });
      
      const addBtn = document.getElementById('add-semester-btn');
      addBtn.style.background = `linear-gradient(to right, ${primaryColor}, ${adjustColor(primaryColor, 20)})`;
      
      const calculateBtn = document.getElementById('calculate-btn');
      calculateBtn.style.backgroundColor = accentColor;
      
      const resetBtn = document.getElementById('reset-btn');
      resetBtn.style.backgroundColor = buttonColor;
      
      // Update fonts
      document.getElementById('main-title').style.fontFamily = `${customFont}, ${baseFontStack}`;
      document.getElementById('main-title').style.fontSize = `${baseSize * 2}px`;
      
      document.getElementById('subtitle').style.fontFamily = `${customFont}, ${baseFontStack}`;
      document.getElementById('subtitle').style.fontSize = `${baseSize * 1.125}px`;
      
      document.querySelectorAll('button').forEach(btn => {
        btn.style.fontFamily = `${customFont}, ${baseFontStack}`;
        btn.style.fontSize = `${baseSize}px`;
      });
      
      document.querySelectorAll('input, label').forEach(el => {
        el.style.fontFamily = `${customFont}, ${baseFontStack}`;
        el.style.fontSize = `${baseSize * 0.875}px`;
      });
    }
    
    function adjustColor(color, amount) {
      const num = parseInt(color.slice(1), 16);
      const r = Math.max(0, Math.min(255, (num >> 16) + amount));
      const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
      const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
      return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
    }

    function addSemester() {
      semesterCount++;
      const container = document.getElementById('semesters-container');
      
      const semesterDiv = document.createElement('div');
      semesterDiv.className = 'semester-item bg-gray-50 p-4 rounded-xl';
      semesterDiv.dataset.semesterId = semesterCount;
      
      semesterDiv.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base sm:text-lg font-semibold text-gray-800">Semester ${semesterCount}</h3>
          <button class="delete-btn text-red-500 hover:text-red-700 font-bold text-xl" onclick="deleteSemester(${semesterCount})">×</button>
        </div>
        <div class="grid grid-cols-1 gap-3">
          <div>
            <label class="block text-gray-700 font-medium mb-1 text-sm">Semester Name</label>
            <input type="text" placeholder="e.g., Fall 2024" 
              class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg input-focus text-gray-800"
              data-semester="${semesterCount}" data-type="semester-name">
          </div>
          <div class="courses-container-${semesterCount}" data-semester="${semesterCount}">
            <!-- Courses will be added here -->
          </div>
          <button class="add-course-btn w-full bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-medium py-2 px-4 rounded-lg transition-all duration-200" onclick="addCourse(${semesterCount})">
            + Add Course
          </button>
        </div>
      `;
      
      container.appendChild(semesterDiv);
      
      // Add first course by default
      addCourse(semesterCount);
    }
    
    let courseCounters = {};
    
    function addCourse(semesterId) {
      if (!courseCounters[semesterId]) {
        courseCounters[semesterId] = 0;
      }
      courseCounters[semesterId]++;
      
      const courseId = courseCounters[semesterId];
      const coursesContainer = document.querySelector(`.courses-container-${semesterId}`);
      
      const courseDiv = document.createElement('div');
      courseDiv.className = 'course-item bg-white p-3 rounded-lg border-2 border-gray-200 mb-3';
      courseDiv.dataset.courseId = `${semesterId}-${courseId}`;
      
      courseDiv.innerHTML = `
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-semibold text-gray-700">Course ${courseId}</span>
          <button class="delete-btn text-red-400 hover:text-red-600 font-bold text-lg" onclick="deleteCourse('${semesterId}-${courseId}')">×</button>
        </div>
        <div class="grid grid-cols-1 gap-2">
          <div>
            <label class="block text-gray-600 font-medium mb-1 text-xs">Course Name</label>
            <input type="text" placeholder="e.g., Data Structures" 
              class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus text-gray-800 text-sm"
              data-course="${semesterId}-${courseId}" data-type="name">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-gray-600 font-medium mb-1 text-xs">Grade</label>
              <select class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus text-gray-800 text-sm"
                data-course="${semesterId}-${courseId}" data-type="grade">
                <option value="">Select</option>
                <option value="A+">A+</option>
                <option value="A">A</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B">B</option>
                <option value="B-">B-</option>
                <option value="C+">C+</option>
                <option value="C">C</option>
                <option value="C-">C-</option>
                <option value="D">D</option>
                <option value="F">F</option>
              </select>
            </div>
            <div>
              <label class="block text-gray-600 font-medium mb-1 text-xs">Credits</label>
              <input type="number" step="0.5" min="0" placeholder="e.g., 3" 
                class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus text-gray-800 text-sm"
                data-course="${semesterId}-${courseId}" data-type="credits">
            </div>
          </div>
        </div>
      `;
      
      coursesContainer.appendChild(courseDiv);
    }
    
    function deleteCourse(courseId) {
      const courseDiv = document.querySelector(`[data-course-id="${courseId}"]`);
      if (courseDiv) {
        courseDiv.remove();
      }
    }

    function deleteSemester(id) {
      const semesterDiv = document.querySelector(`[data-semester-id="${id}"]`);
      if (semesterDiv) {
        semesterDiv.remove();
      }
    }

    // Grade to GPA conversion (4.0 scale - standard US system)
    function gradeToGPA(grade) {
      const gradeMap = {
        'A+': 4.0,
        'A': 4.0,
        'A-': 3.7,
        'B+': 3.3,
        'B': 3.0,
        'B-': 2.7,
        'C+': 2.3,
        'C': 2.0,
        'C-': 1.7,
        'D': 1.0,
        'F': 0.0
      };
      return gradeMap[grade] !== undefined ? gradeMap[grade] : null;
    }

    function calculateCGPA() {
      const semesters = document.querySelectorAll('.semester-item');
      
      if (semesters.length === 0) {
        showResult(0, 0, true, 'Please add at least one semester');
        return;
      }
      
      let totalWeightedPoints = 0;
      let totalCredits = 0;
      let hasError = false;
      let errorMessage = '';
      let validCourseCount = 0;
      
      semesters.forEach(semester => {
        const courses = semester.querySelectorAll('.course-item');
        
        courses.forEach(course => {
          const courseId = course.dataset.courseId;
          const gradeSelect = document.querySelector(`select[data-course="${courseId}"][data-type="grade"]`);
          const creditsInput = document.querySelector(`input[data-course="${courseId}"][data-type="credits"]`);
          
          if (!gradeSelect || !creditsInput) return;
          
          const grade = gradeSelect.value.trim();
          const creditsValue = creditsInput.value.trim();
          
          // Skip completely empty courses
          if (!grade && !creditsValue) {
            return;
          }
          
          // Validate that if one field is filled, both must be filled
          if (!grade && creditsValue) {
            hasError = true;
            errorMessage = 'Please select a grade for all courses with credits entered';
            return;
          }
          
          if (grade && !creditsValue) {
            hasError = true;
            errorMessage = 'Please enter credits for all courses with grades selected';
            return;
          }
          
          // Parse and validate credits
          const credits = parseFloat(creditsValue);
          if (isNaN(credits) || credits <= 0) {
            hasError = true;
            errorMessage = 'Credits must be a positive number greater than 0';
            return;
          }
          
          // Get grade point value
          const gradePointValue = gradeToGPA(grade);
          if (gradePointValue === null) {
            hasError = true;
            errorMessage = 'Invalid grade selected';
            return;
          }
          
          // Accumulate weighted points and credits
          // Formula: (Grade Point × Credits) for each course
          totalWeightedPoints += (gradePointValue * credits);
          totalCredits += credits;
          validCourseCount++;
        });
      });
      
      // Check for errors
      if (hasError) {
        showResult(0, 0, true, errorMessage);
        return;
      }
      
      // Ensure at least one valid course exists
      if (validCourseCount === 0) {
        showResult(0, 0, true, 'Please add at least one course with grade and credits');
        return;
      }
      
      // Calculate CGPA: Sum of (Grade Point × Credits) ÷ Total Credits
      const cgpa = totalWeightedPoints / totalCredits;
      showResult(cgpa, totalCredits, false, '');
    }

    function showResult(cgpa, credits, isError, message) {
      const resultContainer = document.getElementById('result-container');
      const cgpaValue = document.getElementById('cgpa-value');
      const totalCreditsEl = document.getElementById('total-credits');
      
      if (isError) {
        resultContainer.classList.remove('hidden');
        resultContainer.classList.add('result-pulse');
        cgpaValue.textContent = '—';
        totalCreditsEl.textContent = message;
        setTimeout(() => resultContainer.classList.remove('result-pulse'), 500);
        return;
      }
      
      resultContainer.classList.remove('hidden');
      resultContainer.classList.add('result-pulse');
      cgpaValue.textContent = cgpa.toFixed(2);
      totalCreditsEl.textContent = `Total Credits: ${credits}`;
      
      setTimeout(() => resultContainer.classList.remove('result-pulse'), 500);
    }

    function resetCalculator() {
      document.getElementById('semesters-container').innerHTML = '';
      document.getElementById('result-container').classList.add('hidden');
      semesterCount = 0;
      courseCounters = {};
    }

    function clearAllData() {
      // Clear all input fields in all courses
      const allInputs = document.querySelectorAll('input[data-course], select[data-course]');
      allInputs.forEach(input => {
        if (input.tagName === 'SELECT') {
          input.value = '';
        } else {
          input.value = '';
        }
      });
      
      // Clear semester name inputs
      const semesterNameInputs = document.querySelectorAll('input[data-type="semester-name"]');
      semesterNameInputs.forEach(input => {
        input.value = '';
      });
      
      // Hide result
      document.getElementById('result-container').classList.add('hidden');
    }

    // Event Listeners
    document.getElementById('add-semester-btn').addEventListener('click', addSemester);
    document.getElementById('calculate-btn').addEventListener('click', calculateCGPA);
    document.getElementById('reset-btn').addEventListener('click', resetCalculator);
    document.getElementById('clear-all-btn').addEventListener('click', clearAllData);

    // Initialize SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (value) => {
                config.primary_color = value;
                window.elementSdk.setConfig({ primary_color: value });
              }
            },
            {
              get: () => config.secondary_color || defaultConfig.secondary_color,
              set: (value) => {
                config.secondary_color = value;
                window.elementSdk.setConfig({ secondary_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.accent_color || defaultConfig.accent_color,
              set: (value) => {
                config.accent_color = value;
                window.elementSdk.setConfig({ accent_color: value });
              }
            },
            {
              get: () => config.button_color || defaultConfig.button_color,
              set: (value) => {
                config.button_color = value;
                window.elementSdk.setConfig({ button_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              window.elementSdk.setConfig({ font_family: value });
            }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (value) => {
              config.font_size = value;
              window.elementSdk.setConfig({ font_size: value });
            }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ['main_title', config.main_title || defaultConfig.main_title],
          ['subtitle', config.subtitle || defaultConfig.subtitle],
          ['add_button_text', config.add_button_text || defaultConfig.add_button_text],
          ['calculate_button_text', config.calculate_button_text || defaultConfig.calculate_button_text],
          ['reset_button_text', config.reset_button_text || defaultConfig.reset_button_text]
        ])
      });
    }
    
    // Add one semester by default
    addSemester();
  </script>
